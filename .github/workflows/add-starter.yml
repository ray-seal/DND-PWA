name: Add starter scaffold

on:
  workflow_dispatch:

jobs:
  add-starter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main
          persist-credentials: true

      - name: Create starter scaffold files and commit to branch
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail

          mkdir -p src/components src/workers public/icons

          cat > package.json <<'EOF'
{
  "name": "dnd-pwa",
  "version": "0.1.0",
  "private": true,
  "scripts": {
    "dev": "vite",
    "build": "vite build",
    "preview": "vite preview"
  },
  "dependencies": {
    "react": "^18.2.0",
    "react-dom": "^18.2.0",
    "rpg-dice-roller": "^5.2.0"
  },
  "devDependencies": {
    "vite": "^5.2.0",
    "@vitejs/plugin-react": "^5.0.0",
    "vite-plugin-pwa": "^1.0.0"
  }
}
EOF

          cat > vite.config.js <<'EOF'
import { defineConfig } from 'vite';
import react from '@vitejs/plugin-react';
import { VitePWA } from 'vite-plugin-pwa';

export default defineConfig({
  plugins: [
    react(),
    VitePWA({
      registerType: 'autoUpdate',
      manifest: {
        name: 'DnD DM PWA',
        short_name: 'DnDDM',
        start_url: '/',
        display: 'standalone',
        background_color: '#0f172a',
        theme_color: '#0f172a',
        icons: [
          { src: '/icons/icon-192.png', sizes: '192x192', type: 'image/png' },
          { src: '/icons/icon-512.png', sizes: '512x512', type: 'image/png' }
        ]
      }
    })
  ]
});
EOF

          cat > index.html <<'EOF'
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DnD DM PWA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
EOF

          mkdir -p public
          cat > public/manifest.webmanifest <<'EOF'
{
  "name": "DnD DM PWA",
  "short_name": "DnDDM",
  "start_url": "/",
  "display": "standalone",
  "background_color": "#0f172a",
  "theme_color": "#0f172a",
  "icons": [
    { "src": "/icons/icon-192.png", "sizes": "192x192", "type": "image/png" },
    { "src": "/icons/icon-512.png", "sizes": "512x512", "type": "image/png" }
  ]
}
EOF

          cat > public/service-worker.js <<'EOF'
const CACHE_NAME = 'dnd-pwa-v1';
const FILES_TO_CACHE = [
  '/',
  '/index.html',
  '/src/main.jsx',
  '/dist/assets/index.js'
];

self.addEventListener('install', (event) => {
  self.skipWaiting();
  event.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(FILES_TO_CACHE)));
});

self.addEventListener('activate', (event) => {
  event.waitUntil(self.clients.claim());
});

self.addEventListener('fetch', (event) => {
  event.respondWith(caches.match(event.request).then(cached => cached || fetch(event.request)));
});
EOF

          cat > src/main.jsx <<'EOF'
import React from 'react';
import { createRoot } from 'react-dom/client';
import App from './App';
import './styles.css';

createRoot(document.getElementById('root')).render(<App />);
EOF

          cat > src/App.jsx <<'EOF'
import React, { useEffect, useState } from 'react';
import DiceRoller from './components/DiceRoller';

export default function App() {
  const [workerStatus, setWorkerStatus] = useState('idle');
  useEffect(() => {
    const worker = new Worker(new URL('./workers/llmWorker.js', import.meta.url), { type: 'module' });
    worker.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === 'status') setWorkerStatus(msg.status);
    };
    worker.postMessage({ type: 'statusCheck' });
    return () => worker.terminate();
  }, []);

  return (
    <div style={{ padding: 20, fontFamily: 'system-ui, sans-serif', maxWidth: 900 }}>
      <h1>DnD DM PWA (starter)</h1>
      <p>Minimal PWA with a Web Worker skeleton for an in-browser LLM.</p>

      <DiceRoller />

      <section style={{ marginTop: 20 }}>
        <h2>AI DM (worker)</h2>
        <p>Worker status: {workerStatus}</p>
        <p>
          The Web Worker at src/workers/llmWorker.js is a placeholder. When you have a WASM/JS runtime (e.g.
          gpt4all-native-web or a llama wasm build), drop code into the worker and communicate via postMessage.
        </p>
      </section>
    </div>
  );
}
EOF

          cat > src/components/DiceRoller.jsx <<'EOF'
import React, { useState } from 'react';
import { DiceRoller } from 'rpg-dice-roller';

export default function DiceRollerComponent() {
  const [expr, setExpr] = useState('1d20+3');
  const [result, setResult] = useState('');

  function roll() {
    try {
      const dr = new DiceRoller();
      const r = dr.roll(expr);
      setResult(r.output);
    } catch (e) {
      setResult('Invalid expression');
    }
  }

  return (
    <div>
      <h2>Dice Roller</h2>
      <div style={{ display: 'flex', alignItems: 'center' }}>
        <input value={expr} onChange={(e) => setExpr(e.target.value)} style={{ width: 260, padding: 6 }} />
        <button onClick={roll} style={{ marginLeft: 8, padding: '6px 10px' }}>Roll</button>
      </div>
      <div style={{ marginTop: 8, whiteSpace: 'pre-wrap' }}>{result}</div>
    </div>
  );
}
EOF

          cat > src/workers/llmWorker.js <<'EOF'
// Worker skeleton for in-browser LLM integration.
// The UI can send: { type: 'loadModel', url: '...' } and { type: 'generate', prompt: '...' }

self.onmessage = async (e) => {
  const msg = e.data;
  if (msg.type === 'statusCheck') {
    self.postMessage({ type: 'status', status: 'placeholder-ready' });
    return;
  }

  if (msg.type === 'loadModel') {
    self.postMessage({ type: 'status', status: 'loaded-placeholder' });
  } else if (msg.type === 'generate') {
    const prompt = msg.prompt || '';
    const reply = {
      text: `Placeholder DM response to prompt: ${prompt.slice(0, 120)}...`,
      structure: { description: 'A short scene description', options: ['Option A', 'Option B'] }
    };
    self.postMessage({ type: 'response', reply });
  }
};
EOF

          cat > src/prompt-templates.json <<'EOF'
{
  "system_dm": "You are a helpful Dungeons & Dragons dungeon master. Keep descriptions vivid but concise (2-4 sentences). Provide 2 actionable options players can choose from. If dice or stats are provided, incorporate them into the outcome. Output must be valid JSON with keys: 'description', 'options' (array of strings), and optional 'meta'.",
  "scene_prompt": "Scene context: {scene}\nPlayer actions: {actions}\nRecent dice: {dice_results}\nReturn JSON as described in system_dm.",
  "npc_prompt": "NPC: {npc_name}\nPersonality: {npc_personality}\nQuestion: {question}\nRespond as the NPC in-character in a single short paragraph, then provide 2 possible plot hooks in the 'options' array of the JSON."
}
EOF

          cat > README.md <<'EOF'
# dnd-pwa (starter)

Minimal starter for a DnD PWA with an AI DM worker skeleton (Option B).

Quick start:
1. Install:
   npm install

2. Run dev:
   npm run dev

3. Build:
   npm run build
   npm run preview

Where to put your in-browser model:
- Edit src/workers/llmWorker.js and integrate the WASM/JS runtime (gpt4all-native-web, llama wasm, etc).
- Load weights once (consider storing in IndexedDB) and run inference inside the worker to avoid blocking the UI.

Pushing to GitHub (example)
- Initialize locally, add files, create repo on GitHub, and push (see commands below).

License: MIT
EOF

          cat > .gitignore <<'EOF'
node_modules
dist
.env
.DS_Store
EOF

          # Ensure icons exist (tiny placeholders)
          convert -size 192x192 xc:#0f172a public/icons/icon-192.png 2>/dev/null || true
          convert -size 512x512 xc:#0f172a public/icons/icon-512.png 2>/dev/null || true

          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"

          # Create branch and commit
          git checkout -b starter/scaffold || git switch starter/scaffold
          git add .
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "Add starter scaffold"
          fi

          # Push branch
          git push --set-upstream origin starter/scaffold

      - name: Open a pull request
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_TITLE="Add starter scaffold"
          PR_BODY="This PR was created by a workflow to add a starter scaffold (Vite + React + PWA + worker skeleton)."
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls"
          # Create PR
          RESPONSE=$(curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API_URL}" -d "{\"title\":\"${PR_TITLE}\",\"head\":\"starter/scaffold\",\"base\":\"main\",\"body\":\"${PR_BODY}\"}")
          echo "$RESPONSE"
