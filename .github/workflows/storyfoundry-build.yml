name: StoryFoundry build
on:
  push:
    branches:
      - main
      - rebuild/experience-engine
      - feature/tabletop-rpg-foundation
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check api/adventure.js
      - run: npm test
      - run: npm run build
